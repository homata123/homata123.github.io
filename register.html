<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Đăng Ký - Fun Zone</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 3px solid #4ecdc4;
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 2.5rem;
            color: #4ecdc4;
            text-shadow: 2px 2px 0px #ffd93d;
            margin-bottom: 10px;
        }

        .register-header p {
            color: #666;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.3);
            transform: scale(1.02);
        }

        .register-button {
            width: 100%;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .register-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
        }

        .register-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #4ecdc4;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .back-link a:hover {
            color: #ff6b6b;
            text-shadow: 1px 1px 0px #ffd93d;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
        }

        .demo-credentials {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #1565c0;
        }

        .demo-credentials strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="register-container">
            <div class="register-header">
                <h1>📝 Đăng Ký</h1>
                <p>Tham gia Fun Zone ngay hôm nay! 🎉</p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="demo-credentials">
                <strong>🧪 Demo Credentials:</strong>
                Click để tự động điền thông tin đăng ký
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">👤 Họ và tên:</label>
                    <input type="text" id="fullName" name="fullName" class="form-input" placeholder="Nhập họ và tên"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">📧 Email:</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="Nhập email của bạn"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">🔒 Mật khẩu:</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Nhập mật khẩu"
                        required>
                </div>

                <div class="form-group">
                    <label for="memberCode">🎫 Mã thành viên:</label>
                    <input type="text" id="memberCode" name="memberCode" class="form-input"
                        placeholder="Nhập mã thành viên" required>
                </div>

                <button type="submit" class="register-button" id="registerButton">
                    🚀 Đăng Ký
                </button>

                <div class="loading" id="loading">
                    <div class="floating">⏳ Đang xử lý...</div>
                </div>
            </form>

            <div class="back-link">
                <a href="login.html">← Đã có tài khoản? Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const memberCode = document.getElementById('memberCode').value;
            const registerButton = document.getElementById('registerButton');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Show loading state
            registerButton.style.display = 'none';
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            try {
                const result = await register(fullName, email, password, memberCode);

                if (result.success) {
                    successMessage.textContent = result.message;
                    successMessage.style.display = 'block';

                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    throw new Error(result.message || 'Đăng ký thất bại');
                }
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';

                // Reset form state
                registerButton.style.display = 'block';
                loading.style.display = 'none';
            }
        });

        // Auto-fill demo credentials for convenience
        document.addEventListener('DOMContentLoaded', function () {
            const fullNameField = document.getElementById('fullName');
            const emailField = document.getElementById('email');
            const passwordField = document.getElementById('password');
            const memberCodeField = document.getElementById('memberCode');

            // Add click handler to demo credentials
            document.querySelector('.demo-credentials').addEventListener('click', function () {
                fullNameField.value = 'Test User';
                emailField.value = 'test@example.com';
                passwordField.value = 'test123';
                memberCodeField.value = 'TEST123';
            });
        });
    </script>
</body>

</html>
