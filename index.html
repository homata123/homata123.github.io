<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ada's Feed — Tin tức mỗi ngày</title>
<meta name="description" content="Bảng tin tổng hợp công nghệ, AI, khoa học, game và cộng đồng Facebook — cập nhật nhiều lần mỗi ngày.">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280;
    --border:#e5e7eb; --accent:#2563eb; --chip:#eef2ff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#171a21; --text:#e8eaed; --muted:#9aa3af; --border:#262b36; --accent:#6ea8ff; --chip:#1d2739; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 10px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  #search{width:100%;margin-top:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px}
  main{padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .card a{display:block;color:inherit;text-decoration:none}
  .card img{width:100%;max-height:320px;object-fit:cover;display:block;background:var(--chip)}
  .body{padding:12px 14px 14px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--accent);font-weight:600}
  .badge.fb{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .title{font-size:16px;font-weight:700;line-height:1.35}
  .summary{font-size:14px;color:var(--text);opacity:.88;line-height:1.5;margin-top:4px}
  .meta{font-size:12px;color:var(--muted);margin-top:8px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 16px 30px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>📰 Ada's Feed</h1>
    <div class="sub">Tin công nghệ, AI, khoa học, game &amp; cộng đồng — cập nhật nhiều lần mỗi ngày</div>
    <div class="filters" id="filters"></div>
    <input id="search" type="search" placeholder="Tìm trong bảng tin…">
  </div>
</header>
<main>
  <div class="wrap" id="feed"></div>
  <div class="wrap empty" id="empty" hidden>Chưa có tin nào khớp bộ lọc.</div>
</main>
<footer>Tổng hợp tự động bởi Ada • Mọi tin đều dẫn về nguồn gốc — bấm vào thẻ để đọc bài đầy đủ.</footer>
<script>
const CATS = ["Tất cả","AI & Công nghệ","Bảo mật","Khoa học","Game","Video","Facebook"];
let items = [], activeCat = "Tất cả", query = "";

function relTime(iso){
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 3600) return Math.max(1, Math.floor(s/60)) + " phút trước";
  if (s < 86400) return Math.floor(s/3600) + " giờ trước";
  const d = new Date(iso);
  return Math.floor(s/86400) + " ngày trước • " + d.toLocaleDateString("vi-VN");
}
function esc(t){ const d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }

function render(){
  const feed = document.getElementById("feed");
  const list = items.filter(it =>
    (activeCat==="Tất cả" || it.category===activeCat || (activeCat==="Facebook" && it.flow==="facebook")) &&
    (!query || (it.title+" "+it.summary).toLowerCase().includes(query))
  );
  document.getElementById("empty").hidden = list.length>0;
  feed.innerHTML = list.map(it => `
    <article class="card"><a href="${esc(it.url)}" target="_blank" rel="noopener">
      ${it.image ? `<img src="${esc(it.image)}" alt="" loading="lazy">` : ""}
      <div class="body">
        <div class="badges">
          <span class="badge">${esc(it.category)}</span>
          ${it.flow==="facebook" ? `<span class="badge fb">Facebook</span>` : ""}
        </div>
        <div class="title">${esc(it.title)}</div>
        <div class="summary">${esc(it.summary)}</div>
        <div class="meta">${relTime(it.ts)} • Nguồn: ${esc(it.source)}</div>
      </div>
    </a></article>`).join("");
}

const filtersEl = document.getElementById("filters");
CATS.forEach(c=>{
  const b=document.createElement("button");
  b.className="chip"+(c==="Tất cả"?" active":""); b.textContent=c;
  b.onclick=()=>{ activeCat=c; document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===b)); render(); };
  filtersEl.appendChild(b);
});
document.getElementById("search").addEventListener("input", e=>{ query=e.target.value.trim().toLowerCase(); render(); });

fetch("feed.json", {cache:"no-store"})
  .then(r=>r.json())
  .then(data=>{ items = data.sort((a,b)=> new Date(b.ts)-new Date(a.ts)); render(); })
  .catch(()=>{ document.getElementById("empty").hidden=false; document.getElementById("empty").textContent="Chưa tải được dữ liệu tin."; });
</script>
</body>
</html>
